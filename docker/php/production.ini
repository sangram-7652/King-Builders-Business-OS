; King Builders Business OS — PRODUCTION PHP overrides (M12)
;
; Mounted as conf.d/zzz-production.ini by docker-compose.prod.yml so it loads
; AFTER (and overrides) zz-app.ini / zz-opcache.ini. No image rebuild needed.

; --- Error handling: never render errors to the client -------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; --- Opcache: compiled, no timestamp checks (deploys ship a fresh image) --
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; --- Realpath cache — bigger, longer TTL on a read-only code tree ---------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Upload limits (match nginx client_max_body_size + M9 DOCUMENT_MAX_KB) --
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 512M
max_execution_time = 60

; --- Session hardening (session data itself lives in Redis) --------------
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
