; King Builders Business OS — PHP runtime tuning
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC
expose_php = Off

; Fail fast in local/dev; production images should set these to Off / a log path.
display_errors = On
log_errors = On
error_log = /dev/stderr
