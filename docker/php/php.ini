; King Builders Business OS — PHP runtime tuning
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC
expose_php = Off

; Never render PHP errors to the client — Laravel's own debug handler covers
; local/dev when APP_DEBUG=true (F-M12-6). Production keeps this Off too; the
; prod overlay only reasserts it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
