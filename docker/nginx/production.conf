###############################################################################
# King Builders Business OS — PRODUCTION nginx (M12)
#
# TLS terminates here. Certificates are mounted at /etc/nginx/certs:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# (Let's Encrypt: symlink or copy live/<domain>/{fullchain,privkey}.pem there.)
#
# If TLS is terminated by an upstream load balancer instead, point the LB at
# port 80 of this container and delete the `listen 443` server block — the app
# still learns the real scheme from X-Forwarded-Proto (TRUSTED_PROXIES).
###############################################################################

# ---- HTTP: redirect to HTTPS; allow ACME + health probes straight through ---
#
# The PHP-FPM handler is deliberately NOT exposed on this cleartext vhost. Only
# the two health endpoints reach it (via a fixed SCRIPT_FILENAME — no arbitrary
# "*.php" routing), and only the ACME challenge dir serves files. Everything
# else — including any "*.php" request — is a plain 301 to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    # Uptime / container / load-balancer probes hit http:// — don't 301 them.
    # These pass through index.php only; no other path can reach FastCGI here.
    location = /up      { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $realpath_root/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_pass app:9000; }
    location = /healthz { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $realpath_root/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_pass app:9000; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the application ------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Limits / hardening ---------------------------------------------
    client_max_body_size 24M;          # matches php upload_max_filesize + M9 DOCUMENT_MAX_KB
    client_body_timeout 30s;
    send_timeout 30s;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    # --- Static assets (fingerprinted by Vite → cache hard) -------------
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 7d; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- M9/M10: NEVER serve stored documents directly. ------------------
    # The private disk is storage/app/private/** and is not under webroot, but
    # deny the public symlink dir too for defence in depth — downloads only go
    # through the authorised DocumentDownloadController.
    location ^~ /storage/ {
        # only genuinely-public M9 assets live here; block everything private
        location ~* \.(php|phtml|env|sql|log|bak)$ { deny all; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles / VCS / editor / dependency manifests.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|\.env.*|artisan|phpunit\.xml)$ { deny all; }

    # Nothing outside public/ is reachable — index.php only sets up the app.
    location ~* ^/(app|bootstrap|config|database|resources|routes|storage/(?!app/public)|tests|vendor)/ {
        deny all;
    }
}
