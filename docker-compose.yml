###############################################################################
# King Builders Business OS — local development stack
#
#   app        Laravel / PHP-FPM
#   nginx      Web server            -> http://localhost:8080
#   mysql      MySQL 8               -> localhost:3307
#   redis      Redis 7               -> localhost:6379
#   queue      Laravel queue worker  (redis connection)
#   scheduler  Laravel scheduler     (schedule:work)
#   vite       Asset dev server / HMR (profile: dev) -> http://localhost:5173
#
# Bring up:   docker compose up -d --build
###############################################################################

x-php-build: &php-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      WWWUID: ${WWWUID:-1000}
      WWWGID: ${WWWGID:-1000}
  image: king-builders/app:local
  volumes:
    - ./:/var/www/html:cached
  environment:
    - APP_BOOTSTRAP=false
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - king-builders

services:
  app:
    <<: *php-build
    container_name: king-builders-app
    environment:
      - APP_BOOTSTRAP=true
    # default CMD (php-fpm) from the image

  nginx:
    image: nginx:1.27-alpine
    container_name: king-builders-nginx
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - king-builders

  mysql:
    image: mysql:8.0
    container_name: king-builders-mysql
    command: --default-authentication-plugin=caching_sha2_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: king_builders
      MYSQL_USER: king_builders
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - king-builders

  redis:
    image: redis:7-alpine
    container_name: king-builders-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - king-builders

  queue:
    <<: *php-build
    container_name: king-builders-queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --backoff=5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  scheduler:
    <<: *php-build
    container_name: king-builders-scheduler
    command: php artisan schedule:work
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  vite:
    image: node:22-alpine
    container_name: king-builders-vite
    profiles: ["dev"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_HOST_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html:cached
    networks:
      - king-builders

networks:
  king-builders:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
